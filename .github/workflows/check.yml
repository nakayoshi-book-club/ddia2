name: Build and check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/build.py
      - run: node tools/check.js
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
